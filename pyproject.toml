[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moodshift-ai"
version = "0.1.0"
description = "Foundation for a mood-based image processing university project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Pillow>=11.1,<13",
    "numpy>=2.2,<3",
    "opencv-python-headless>=4.11,<5",
    "torch>=2.10,<2.11",
    "torchvision>=0.25,<0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = ["integration: opt-in tests using cached official pretrained weights"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
